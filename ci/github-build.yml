name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx electron-vite build
      # Playwright drives the built Electron app (_electron works on the Windows runner's desktop session)
      - run: npx vitest run --config vitest.e2e.config.ts
        env:
          E2E_PORT: '47910'

  package:
    needs: test
    # tags go through the `release` job below instead
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # unsigned builds: no Apple Developer ID / Windows certificate configured
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: claude-visualized-${{ matrix.os }}
          path: |
            release/*/*.exe
            release/*/*.dmg
          if-no-files-found: error

  # Tag-triggered release: `git tag v0.2.0 && git push origin v0.2.0` builds and publishes both platforms to GitHub Releases.
  # electron-builder creates the release (releaseType "release") and uploads the installer, its .blockmap and latest.yml / latest-mac.yml,
  # which is what installed apps poll. See RELEASING.md.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: release:win
          # the macOS build is attached by .github/workflows/release-mac.yml once the release is published
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # unsigned builds: no Apple Developer ID / Windows certificate configured
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
